
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Furqan International Quran Academy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }
    .card {
      background: white;
      max-width: 420px;
      margin: 40px auto;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #176b50; font-size: 25px; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #176b50;
      color: white;
      border: 0;
      cursor: pointer;
    }
    .note { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Al Furqan International Quran Academy</h1>
    <h2>Attendance Portal</h2>
    <p>حاضری پورٹل</p>
    <form onsubmit="event.preventDefault(); alert('Login system will be connected in the next step.');">
      <input type="text" placeholder="Student Roll Number" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login / لاگ اِن</button>
    </form>
    <p class="note">Student Attendance Management System</p>
  </div>
</body>
</html>
